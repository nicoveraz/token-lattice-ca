[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatecheck"
version = "0.1.0"
description = "A measure-and-falsification toolbox: calibration gates, provenance stamps, preregistration, pseudoreplication checks, exact-null certification, and manuscript number manifests for empirical research code."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
