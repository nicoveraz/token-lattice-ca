# textca is NOT a library. It is a research repository whose scripts resolve imports through a
# sys.path shim (see conftest.py), so this file exists for three things only: to declare the
# dependency set, to pin the tool configuration, and to give CI something to install. The
# `packages = []` below is deliberate -- `pip install -e .` must be a no-op that installs
# dependencies without shadowing the shim, because changing how `src/` and `experiments/` are
# imported would change which code the golden files were produced by.
#
# The installable package in this repo is gatecheck/, which has its own pyproject.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textca"
version = "0.0.0"
description = "Cellular automata over token lattices: a black-box measurement instrument for language models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.2",
    "transformers>=4.40",
    "huggingface-hub>=0.23",
    "datasets>=2.19",
    "scipy>=1.11",
    "matplotlib>=3.8",
    # src/ca.py (the Phase-1 word-level CA) imports jax at module level, and tests/test_harness.py
    # imports ca -- so the suite cannot even COLLECT without it. Missing here until the repository
    # went public and CI ran on a clean machine for the first time; every local .venv already had
    # it, which is exactly the kind of gap a lockfile hides and a fresh install exposes.
    # [cpu] rather than bare jax: it pins jaxlib to the CPU wheel instead of leaving the variant to
    # pip's resolver, matching the workflow's JAX_PLATFORMS=cpu and the same reasoning that makes
    # it install CPU-only torch. The lockfile carries jax and jaxlib as separate pins for this.
    "jax[cpu]>=0.4",
]

[project.optional-dependencies]
# The suite imports numpy and pytest everywhere, torch in two files, transformers in one, and
# jax transitively via src/ca.py. It touches no network and loads no model weights -- that is what
# makes it CI-able at all.
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
packages = []                      # see the header: install deps, do not shadow the sys.path shim

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. This repo's comments and docstrings carry the reasoning behind findings,
# and a linter that reformats them destroys evidence. Errors and undefined names only.
select = ["E9", "F63", "F7", "F82"]
