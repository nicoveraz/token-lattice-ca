# The suite loads no model weights and touches no network (verified: torch appears in 2 test
# files, transformers in 1, and neither calls from_pretrained). That is the only reason this
# repository can have CI at all, and it is worth keeping true -- a test that downloads a
# checkpoint would make this workflow useless and the guarantee unverifiable.
name: tests

on:
  push:
    branches: [main, camera-ready]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      HF_HUB_OFFLINE: "1"          # a test that reaches the network must FAIL here, loudly
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the GPU wheels are ~2GB and nothing here needs them.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[test]"

      - name: Record the environment that produced this result
        run: |
          python -c "import sys, platform; print(sys.version, platform.platform())"
          pip freeze

      - name: textca suite
        # EXPECTED_SKIPS is a tripwire, and the number is MEASURED, not derived. It is deliberately
        # exact, so a new legitimate skip fails here and has to be acknowledged rather than absorbed
        # -- a suite whose green depends on skips must not be able to grow new ones silently.
        #
        # 13 -> 15 on 21 Aug 2026, when the paper-2 branch merged. It did its job: nothing failed,
        # the count moved. One new skip is identified -- a THIRD retained superseded record
        # (groq_share_scalaronly_superseded.json), which test_results_self_consistency skips by
        # design because a superseded record is not a live result.
        #
        # `-rs` is now passed so every skip REASON is printed in the log. The previous comment
        # carried a hand-maintained decomposition ("2 paper.pdf, 2 superseded, 1 absent HF cache,
        # 8 real-backend") that had gone stale against PR #111's offline-skip change, so the next
        # person to hit this tripwire was going to reconcile a number against a wrong breakdown.
        # Read the reasons out of the log instead of trusting a comment.
        env:
          EXPECTED_SKIPS: "15"
        run: pytest tests/ -q -rs

      - name: gatecheck suite
        run: |
          pip install -e ./gatecheck
          pytest gatecheck/tests/ -q
